<!DOCTYPE html>
<html lang="ceb">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Medicine Guide - Tan-aw AI</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { padding: 24px; overflow-y: auto; }
    .container { max-width: 600px; margin: 0 auto; }
    .back-btn { display: inline-block; margin-bottom: 24px; text-decoration: none; color: var(--primary); font-weight: bold; }
    .med-card { background: var(--surface); padding: 20px; border-radius: 12px; margin-bottom: 16px; box-shadow: var(--shadow); border-left: 4px solid var(--accent); }
    .med-card .category { font-size: 0.8rem; background: var(--light-green); color: var(--primary); padding: 4px 8px; border-radius: 10px; display: inline-block; margin-bottom: 8px; font-weight: bold; text-transform: uppercase; }
    .med-card h3 { color: var(--text-main); margin-bottom: 8px; font-size: 1.1rem; }
    .med-card p { color: var(--text-muted); font-size: 0.95rem; }
  </style>
</head>
<body>
  <div class="container">
    <a href="index.html" class="back-btn">&larr; Back to Chat</a>
    <h1 style="color: var(--primary); margin-bottom: 8px;">Medicine Guide</h1>
    <p style="color: var(--text-muted); margin-bottom: 24px;">Giya sa mga Tambal ug Bakuna</p>
    <div id="med-list"><p>Loading...</p></div>
  </div>
  <script src="js/api.js"></script>
  <script>
    async function loadMedicines() {
      const list = document.getElementById("med-list");
      try {
        const meds = await getMedicines();
        list.innerHTML = meds.map(m => `
          <div class="med-card">
            <span class="category">${m.category || 'medicine'}</span>
            <h3>${m.name}</h3>
            <p>${m.description || 'Walay deskripsyon.'}</p>
          </div>
        `).join("");
      } catch (err) {
        list.innerHTML = `<p style="color:red;">Failed to load medicines. Make sure backend is running.</p>`;
      }
    }
    loadMedicines();
  </script>
</body>
</html>
