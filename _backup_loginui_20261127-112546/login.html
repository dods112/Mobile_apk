<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0D6E63">
  <title>Sign in - Tan-aw AI</title>
  <link rel="stylesheet" href="css/auth.css?v=114">
</head>
<body>
  <main class="auth-card">
    <div class="auth-logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 21s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.5-7 10-7 10z"/>
        <path d="M9 11l2 2 4-4"/>
      </svg>
    </div>
    <h1>Tan-aw AI</h1>
    <p class="auth-sub">Check before you go<br>Tan-awa una bago ka mangadto</p>

    <form id="login-form" class="auth-form" novalidate>
      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap">
          <input id="password" class="has-toggle" name="password" type="password" autocomplete="current-password" required>
          <button type="button" class="toggle-pw" data-toggle="password" aria-label="Show password">Show</button>
        </div>
      </div>

      <div class="auth-error" id="error" role="alert"></div>
      <button id="submit" class="auth-btn" type="submit">Sign in</button>
    </form>

    <p class="auth-switch">No account yet? <a href="register.html">Register</a></p>
    <p class="auth-foot">First sign-in can take up to a minute while the server wakes up.</p>
  </main>

  <script src="js/api.js?v=114"></script>
  <script src="js/auth.js?v=114" data-guard="none"></script>
  <script>
    const form = document.getElementById("login-form");
    const errorEl = document.getElementById("error");
    const submitBtn = document.getElementById("submit");

    function showError(message) {
      errorEl.textContent = message;
      errorEl.classList.add("show");
    }

    document.querySelectorAll("[data-toggle]").forEach(btn => {
      btn.addEventListener("click", () => {
        const input = document.getElementById(btn.dataset.toggle);
        const show = input.type === "password";
        input.type = show ? "text" : "password";
        btn.textContent = show ? "Hide" : "Show";
        btn.setAttribute("aria-label", show ? "Hide password" : "Show password");
      });
    });

    // Already signed in? Go to the right page
    checkSession().then(user => {
      if (user) location.replace(homePageFor(user.role));
    });

    form.addEventListener("submit", async e => {
      e.preventDefault();
      errorEl.classList.remove("show");

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      if (!username || !password) {
        showError("Enter your username and password.");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Signing in...";
      try {
        const data = await loginRequest(username, password);
        saveAuth(data);
        location.replace(homePageFor(data.role));
      } catch (err) {
        showError(err.message);
        submitBtn.disabled = false;
        submitBtn.textContent = "Sign in";
      }
    });
  </script>
</body>
</html>
