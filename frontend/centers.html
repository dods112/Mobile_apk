<!DOCTYPE html>
<html lang="ceb">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Health Centers - Tan-aw AI</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { padding: 24px; overflow-y: auto; }
    .container { max-width: 600px; margin: 0 auto; }
    .back-btn { display: inline-block; margin-bottom: 24px; text-decoration: none; color: var(--primary); font-weight: bold; }
    .center-card { background: var(--surface); padding: 20px; border-radius: 12px; margin-bottom: 16px; box-shadow: var(--shadow); }
    .center-card h3 { color: var(--primary); margin-bottom: 8px; font-size: 1.1rem; }
    .center-card p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 8px; }
    .btn-map { display: inline-block; background: var(--primary); color: white; padding: 8px 16px; text-decoration: none; border-radius: 8px; font-size: 0.9rem; font-weight: bold; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <a href="index.html" class="back-btn">&larr; Back to Chat</a>
    <h1 style="color: var(--primary); margin-bottom: 8px;">Mga Health Center</h1>
    <p style="color: var(--text-muted); margin-bottom: 24px;">Surigao del Sur</p>
    <div id="center-list"><p>Loading...</p></div>
  </div>
  <script src="js/api.js"></script>
  <script>
    async function loadCenters() {
      const list = document.getElementById("center-list");
      try {
        const centers = await getCenters();
        list.innerHTML = centers.map(c => `
          <div class="center-card">
            <h3>${c.name}</h3>
            <p>${c.address || `Barangay ${c.barangay}`}</p>
            <p style="font-size: 0.8rem; color: #666;">Tel: ${c.contact_number || 'TBA'}</p>
            <a href="https://www.google.com/maps/search/?api=1&query=${c.latitude},${c.longitude}" target="_blank" class="btn-map">📍 View on Map</a>
          </div>
        `).join("");
      } catch (err) {
        list.innerHTML = `<p style="color:red;">Failed to load centers. Make sure backend is running.</p>`;
      }
    }
    loadCenters();
  </script>
</body>
</html>
