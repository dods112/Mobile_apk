<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Medicine Directory - Tan-aw AI</title>
  <link rel="stylesheet" href="css/style.css?v=124">
  <link rel="stylesheet" href="css/responsive.css?v=124">
  <link rel="stylesheet" href="css/pages.css?v=124">
  <link rel="stylesheet" href="css/adaptive.css?v=130">
</head>
<body class="page-body" data-active="medicines">
<div class="app-layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <main class="main-content">
    <header class="md-top">
      <a href="index.html" class="md-back" aria-label="Back to chat">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <div class="md-title">
        <span class="md-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 3.5a5 5 0 0 1 7 7l-7 7a5 5 0 0 1-7-7z"/><path d="M8 8l8 8"/></svg>
        </span>
        <div>
          <h1>Medicine Directory</h1>
          <p>Find medicine availability across health centers</p>
        </div>
      </div>
      <a href="index.html" class="md-home" aria-label="Home">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
      </a>
    </header>

    <section class="page md-page">
      <div class="md-info">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 8h.01"/></svg>
        <div>
          <div>Medicines and vaccines at each health center, with their status. Stock quantities are not recorded yet.</div>
          <div class="md-checked" id="updated-note"></div>
        </div>
      </div>

      <div class="md-search">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="q" type="search" placeholder="Search a medicine, vaccine, or center" aria-label="Search">
        <button type="button" id="md-clear" class="md-clear" hidden aria-label="Clear search">&times;</button>
      </div>

      <div id="filters" class="md-filters" role="tablist" aria-label="Filter by type"></div>
      <div class="md-sort-row">
        <label for="md-sort" class="md-sort-label">Sort</label>
        <select id="md-sort" class="md-sort">
          <option value="name">Name (A-Z)</option>
          <option value="available">Available first</option>
          <option value="low">Low stock first</option>
          <option value="out">Out of stock first</option>
          <option value="recent">Recently updated</option>
        </select>
      </div>
      <div id="md-count" class="md-count"></div>
      <div id="list" class="md-list"></div>
    </section>
  </main>
</div>
<script src="js/api.js?v=124"></script>
<script src="js/lang.js?v=124"></script>
<script src="js/auth.js?v=124" data-guard="resident"></script>
<script src="js/pages.js?v=124"></script>
<script src="js/medicines.js?v=124"></script>
<script src="js/updated-note.js?v=124"></script>
</body>
</html>
