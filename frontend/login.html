<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0D6E63">
  <title>Sign in - Tan-aw AI</title>
  <link rel="stylesheet" href="css/auth.css?v=115">
  <link rel="stylesheet" href="css/adaptive.css?v=120">
  <link rel="icon" type="image/png" href="img/logo.png">
</head>
<body>
  <main class="auth-card">
    <div class="auth-logo" aria-hidden="true">
      <img src="img/logo.png" alt="Tan-aw AI logo" width="100%" height="100%" style="object-fit:contain;display:block;border-radius:inherit">
    </div>
    <h1>Tan-aw AI</h1>
    <p class="auth-tag">Check before you go</p>
    <p class="auth-tag-ceb">Tan-awa una bago ka mangadto</p>
    <p class="auth-welcome">Sign in to check medicine, services, and health centers near you.</p>

    <form id="login-form" class="auth-form" novalidate>
      <div class="field">
        <label for="username">Username</label>
        <div class="input-wrap">
          <span class="input-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
          </span>
          <input id="username" name="username" placeholder="Your username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
        </div>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap">
          <span class="input-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
          </span>
          <input id="password" class="has-toggle" name="password" type="password" placeholder="Your password" autocomplete="current-password" required>
          <button type="button" class="toggle-pw" data-toggle="password" aria-label="Show password">Show</button>
        </div>
      </div>

      <div class="auth-error" id="error" role="alert"></div>
      <button id="submit" class="auth-btn" type="submit">Sign in</button>
    </form>

    <p class="auth-switch">No account yet? <a href="register.html">Register</a></p>

    <div class="trust">
      <div>
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h9"/></svg>
        Check stock
      </div>
      <div>
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
        Find centers
      </div>
      <div>
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        Save time
      </div>
    </div>
    <p class="auth-foot">First sign-in can take up to a minute while the server wakes up.</p>
  </main>

  <script src="js/api.js?v=115"></script>
  <script src="js/auth.js?v=115"></script>
  <script>
    const form = document.getElementById("login-form");
    const errorEl = document.getElementById("error");
    const submitBtn = document.getElementById("submit");

    function showError(message) {
      errorEl.textContent = message;
      errorEl.classList.add("show");
    }

    document.querySelectorAll("[data-toggle]").forEach(btn => {
      btn.addEventListener("click", () => {
        const input = document.getElementById(btn.dataset.toggle);
        const show = input.type === "password";
        input.type = show ? "text" : "password";
        btn.textContent = show ? "Hide" : "Show";
        btn.setAttribute("aria-label", show ? "Hide password" : "Show password");
      });
    });

    // Already signed in? Go to the right page
    checkSession().then(user => {
      if (user) location.replace(homePageFor(user.role));
    });

    form.addEventListener("submit", async e => {
      e.preventDefault();
      errorEl.classList.remove("show");

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      if (!username || !password) {
        showError("Enter your username and password.");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span>Signing in...';
      try {
        const data = await loginRequest(username, password);
        saveAuth(data);
        location.replace(homePageFor(data.role));
      } catch (err) {
        showError(err.message);
        submitBtn.disabled = false;
        submitBtn.textContent = "Sign in";
      }
    });
  </script>
</body>
</html>
