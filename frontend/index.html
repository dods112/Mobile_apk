<!DOCTYPE html>
<html lang="ceb">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#087F75">
  <meta name="description" content="Tan-aw AI - Tan-awa una bago ka mangadto. Check medicine availability and clinic hours in Tandag City before you travel.">
  <title>Tan-aw AI</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23087F75' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 21s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.5-7 10-7 10z'/%3E%3Cpath d='M9 11l2 2 4-4'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 21s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.5-7 10-7 10z"/>
          <path d="M9 11l2 2 4-4"/>
        </svg>
      </div>
      <div class="brand-text">
        <h1>Tan-aw AI</h1>
        <p>Tan-awa una bago ka mangadto</p>
      </div>
    </div>
    <div class="top-actions">
      <span class="status" id="status">
        <span class="dot"></span>
        <span id="status-text">Connecting</span>
      </span>

 <!-- NEW: Link to Centers page -->
      <a href="centers.html" class="icon-btn" aria-label="Mga Health Center" style="text-decoration: none; color: inherit; margin-right: 4px;">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
      </a>

      <button class="icon-btn" id="info-btn" type="button" aria-label="Impormasyon" aria-expanded="false" aria-controls="info-panel">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="9"/>
          <path d="M12 11v5"/>
          <path d="M12 8h.01"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="info-panel" id="info-panel" hidden>
    Ang Tan-aw AI nagpakita ra sa impormasyon gikan sa health center. Dili kini medikal nga tambag. Pangutana sa health center para sa bisan unsang problema sa imong panglawas.
  </div>

  <main id="chat" class="chat"></main>

  <nav class="quick" aria-label="Mga shortcut">
    <button class="quick-btn" type="button" data-prefill="May amoxicillin pa?">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10.5 3.5a5 5 0 0 1 7 7l-7 7a5 5 0 0 1-7-7z"/>
        <path d="M8 8l8 8"/>
      </svg>
      <span>Medicine</span>
    </button>
    <button class="quick-btn" type="button" data-send="Open ba ang health center karon?">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="9"/>
        <path d="M12 7v5l3 2"/>
      </svg>
      <span>Clinic Hours</span>
    </button>
    <button class="quick-btn" type="button" data-send="Asa ang pinakaduol nga health center?">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 21s-6-5.2-6-10a6 6 0 0 1 12 0c0 4.8-6 10-6 10z"/>
        <circle cx="12" cy="11" r="2"/>
      </svg>
      <span>Find Center</span>
    </button>
    <button class="quick-btn" type="button" data-send="Unsa nga serbisyo ang available?">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="5" y="4" width="14" height="17" rx="2"/>
        <path d="M9 4h6v3H9z"/>
        <path d="M9 12h6M9 16h4"/>
      </svg>
      <span>Services</span>
    </button>
  </nav>

  <form id="chat-form" class="composer" autocomplete="off">
    <input id="message" type="text" placeholder="Pangutana bahin sa tambal, bakuna, o serbisyo..." aria-label="Pangutana" required>
    <button type="submit" class="send" aria-label="Ipadala">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 2L11 13"/>
        <path d="M22 2l-7 20-4-9-9-4z"/>
      </svg>
    </button>
  </form>

  <script src="js/api.js"></script>
  <script src="js/chat.js"></script>
</body>
</html>
