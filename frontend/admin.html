<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0D6E63">
<title>Admin - Capsule AI</title>
<style>
:root{--primary:#0D6E63;--line:#DDEBE8;--text:#183B3A;--muted:#647A78;--bg:#EFF8F6}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top h1{font-size:1.05rem;color:var(--primary);margin:0}
.top-actions{display:flex;gap:8px;align-items:center}
.text-btn{min-height:40px;padding:0 14px;border:none;border-radius:999px;background:var(--primary);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding:14px 16px 40px;display:flex;flex-direction:column;gap:14px}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.panel h2{font-size:1rem;margin:0 0 10px;color:var(--primary)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:.8rem;font-weight:600;margin:0 0 4px}
input,select{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;font:inherit;font-size:16px;background:#F8FCFB;color:var(--text)}
.full{grid-column:1/-1}
.btn{min-height:44px;padding:0 18px;border:none;border-radius:999px;background:var(--primary);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.card{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px;background:#fff}
.card h3{margin:0;font-size:.98rem}
.tag{font-size:.76rem;color:var(--muted);margin-top:2px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.mini{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--primary);background:#fff;color:var(--primary);font:inherit;font-size:.82rem;font-weight:600;cursor:pointer}
.mini.danger{border-color:#B42318;color:#B42318}
.admin-msg{padding:10px 12px;border-radius:12px;font-size:.88rem}
.admin-msg[hidden]{display:none}
.admin-msg.ok{background:#DCFCE7;color:#166534}
.admin-msg.err{background:#FEE2E2;color:#991B1B}
.empty{color:var(--muted);text-align:center;padding:18px;border:1px dashed #BFE6DB;border-radius:14px}
.hint{font-size:.78rem;color:var(--muted);margin-top:6px}
@media (max-width:600px){.grid{grid-template-columns:1fr}}
</style>
  <link rel="stylesheet" href="css/adaptive.css?v=130">
  <link rel="icon" type="image/png" href="img/logo.png">
</head>
<body>
<header class="top">
  <h1>Capsule AI · Admin</h1>
  <div class="top-actions"></div>
</header>
<main class="wrap">
  <div id="admin-msg" class="admin-msg" hidden></div>

  <section class="panel">
    <h2>Add a staff account</h2>
    <form id="create-form" class="grid">
      <div><label for="new-name">Full name</label><input id="new-name" required></div>
      <div><label for="new-user">Username</label><input id="new-user" required minlength="3" maxlength="30"></div>
      <div><label for="new-pass">Password</label><input id="new-pass" type="password" minlength="6" required></div>
      <div><label for="new-center">Health center</label><select id="new-center" required></select></div>
      <div class="full">
        <button class="btn" type="submit">Create staff account</button>
        <p class="hint">Usernames: letters, numbers, dots, dashes, or underscores. The staff member signs in on the sign-in page and sees only their center.</p>
      </div>
    </form>
  </section>

  <section class="panel">
    <h2>Staff accounts</h2>
    <div id="staff-list"></div>
  </section>
</main>

<script src="js/api.js?v=113"></script>
<script src="js/auth.js?v=113" data-guard="admin"></script>
<script src="js/admin.js?v=113"></script>
</body>
</html>
