<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Health Centers - Tan-aw AI</title>
  <link rel="stylesheet" href="css/style.css?v=111">
  <link rel="stylesheet" href="css/responsive.css?v=111">
  <link rel="stylesheet" href="css/pages.css?v=111">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body class="page-body" data-active="centers">
<div class="app-layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <main class="main-content">
    <header class="topbar page-top">
      <div class="brand-mobile" id="mobile-menu-btn" role="button" tabindex="0" aria-label="Open menu">
        <div class="logo">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.5-7 10-7 10z"/><path d="M9 11l2 2 4-4"/></svg>
        </div>
        <div class="brand-text"><h1>Health Centers</h1></div>
      </div>
    </header>
    <section class="page">
      <p class="page-sub">Find a health center near you. Distance shows when location is allowed. Hours, services, and medicines are under Details.</p>
      <input id="q" class="search" type="search" placeholder="Search by name or address" aria-label="Search health centers">
      <div id="map" style="height:220px;border-radius:16px;overflow:hidden;border:1px solid #DDEBE8;"></div>
      <div id="list" class="list"></div>
    </section>
  </main>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/api.js?v=111"></script>
<script src="js/lang.js?v=111"></script>
<script src="js/auth.js?v=111" data-guard="resident"></script>
<script src="js/pages.js?v=111"></script>
<script src="js/centers.js?v=111"></script>
</body>
</html>
